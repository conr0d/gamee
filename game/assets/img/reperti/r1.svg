<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Statuetta d'oro, superficie liscia">
  <!-- REPERTO 1 — statuetta d'oro, LISCIA (oro: sì, iscrizione: no)
       Oro caldo e luminoso: è uno dei due estremi della scala di luminosità,
       per non confondersi col bronzo scuro del reperto 4. Nessun glifo:
       la superficie deve leggersi pulita al primo sguardo. -->
  <defs>
    <linearGradient id="r1oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6df8e"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8801d"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect x="18" y="52" width="28" height="6" rx="1.5" fill="#a8801d"/>
  <rect x="18" y="52" width="28" height="2.4" rx="1.2" fill="#f0d179"/>

  <!-- corpo: figura seduta, contorno morbido -->
  <path d="M25 52V38c0-3 1.4-5.4 3.3-7l-1.6-6.2h10.6L35.7 31c1.9 1.6 3.3 4 3.3 7v14z"
        fill="url(#r1oro)"/>
  <!-- copricapo nemes -->
  <path d="M32 8c5 0 8.2 3.5 8.2 8.2 0 3.4-1.2 6-1.2 6l-2.4 2.6h-9.2L25 22.2s-1.2-2.6-1.2-6C23.8 11.5 27 8 32 8z"
        fill="url(#r1oro)"/>
  <!-- volto -->
  <path d="M27.4 15.6h9.2v6.2c0 2.6-2 4.4-4.6 4.4s-4.6-1.8-4.6-4.4z" fill="#f2dfa4"/>
  <circle cx="29.6" cy="19.4" r="1.05" fill="#6b4f12"/>
  <circle cx="34.4" cy="19.4" r="1.05" fill="#6b4f12"/>
  <!-- braccia conserte, niente incisioni sul corpo -->
  <path d="M25.6 40h12.8" stroke="#a8801d" stroke-width="2.2" stroke-linecap="round"/>
  <!-- luce netta sul fianco: dice "metallo lucido", non è un glifo -->
  <path d="M28.4 41.5v9" stroke="#f6df8e" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>
</svg>
