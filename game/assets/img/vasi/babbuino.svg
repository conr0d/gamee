<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vaso col coperchio a testa di babbuino">
  <!-- VASO — coperchio a testa di BABBUINO. Stesso corpo in alabastro
       degli altri tre; pelo grigio-brunito (mai nero come lo sciacallo,
       mai dorato come il falco) e criniera tonda intorno al muso, per
       non essere confuso con lo sciacallo dal muso più stretto e affilato. -->
  <defs>
    <linearGradient id="bCorpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="60%" stop-color="#f0e6d2"/>
      <stop offset="100%" stop-color="#cdbb99"/>
    </linearGradient>
    <linearGradient id="bPelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c8a76"/>
      <stop offset="100%" stop-color="#6b5c4a"/>
    </linearGradient>
  </defs>

  <!-- corpo del vaso -->
  <rect x="24" y="57" width="16" height="4" rx="1.5" fill="#a8977a"/>
  <rect x="19" y="33" width="26" height="26" rx="6" fill="url(#bCorpo)" stroke="#a8977a" stroke-width="1.2"/>
  <rect x="17" y="29" width="30" height="7" rx="3.5" fill="#e2d3ac" stroke="#a8977a" stroke-width="1"/>

  <!-- criniera tonda: cerchio pieno dietro, più largo del muso -->
  <circle cx="32" cy="18.5" r="12.5" fill="url(#bPelo)"/>
  <path d="M25 29.8h14v3.2a2.6 2.6 0 0 1-2.6 2.6H27.6a2.6 2.6 0 0 1-2.6-2.6z" fill="#5a4c3c"/>

  <!-- muso rotondo, largo alla base — la differenza chiave con lo sciacallo -->
  <path d="M32 16.8c5 0 8.4 2.2 8.4 5.6 0 3-2.8 4.6-4.6 5.2-.8 1.2-2.2 1.9-3.8 1.9s-3-.7-3.8-1.9c-1.8-.6-4.6-2.2-4.6-5.2 0-3.4 3.4-5.6 8.4-5.6z"
        fill="#c9bba6"/>
  <ellipse cx="32" cy="24.6" rx="2.6" ry="1.7" fill="#4a3f32"/>
  <path d="M32 24.6v2.4" stroke="#4a3f32" stroke-width="1.2" stroke-linecap="round"/>

  <!-- occhi ravvicinati, profondi -->
  <circle cx="28.4" cy="18.6" r="1.5" fill="#2c241c"/>
  <circle cx="35.6" cy="18.6" r="1.5" fill="#2c241c"/>
</svg>
