<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vaso col coperchio a testa di falco">
  <!-- VASO — coperchio a testa di FALCO. Corpo in alabastro identico agli
       altri tre vasi: la distinzione sta SOLO nella testa del coperchio,
       come nei set reali di vasi canopi. -->
  <defs>
    <linearGradient id="fCorpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="60%" stop-color="#f0e6d2"/>
      <stop offset="100%" stop-color="#cdbb99"/>
    </linearGradient>
    <linearGradient id="fPiuma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b25a"/>
      <stop offset="100%" stop-color="#a8681f"/>
    </linearGradient>
  </defs>

  <!-- corpo del vaso -->
  <rect x="24" y="57" width="16" height="4" rx="1.5" fill="#a8977a"/>
  <rect x="19" y="33" width="26" height="26" rx="6" fill="url(#fCorpo)" stroke="#a8977a" stroke-width="1.2"/>
  <rect x="17" y="29" width="30" height="7" rx="3.5" fill="#e2d3ac" stroke="#a8977a" stroke-width="1"/>

  <!-- testa di falco: becco adunco al centro, piumaggio a bande -->
  <path d="M32 6c8 0 13 5.6 13 12.6 0 5-2.4 8.6-4.4 10.8H23.4C21.4 27.2 19 23.6 19 18.6 19 11.6 24 6 32 6z"
        fill="url(#fPiuma)"/>
  <path d="M25 30h14v3.4a2.6 2.6 0 0 1-2.6 2.6H27.6A2.6 2.6 0 0 1 25 33.4z" fill="#8a5518"/>

  <!-- becco -->
  <path d="M32 17c3.4 0 5.6 2 5.6 4.6 0 2.4-2 4-3.6 6.4-.6.9-1.4.9-2 0-1.6-2.4-3.6-4-3.6-6.4C28.4 19 30.6 17 32 17z"
        fill="#f2c46a" stroke="#8a5518" stroke-width="1"/>

  <!-- occhio col tratto kohl, motivo dell'occhio di Horus -->
  <circle cx="32" cy="15.5" r="2.6" fill="#241a0c"/>
  <path d="M27 15.5c1.4-1.6 3.2-2.4 5-2.4s3.6.8 5 2.4c-1.4 1.6-3.2 2.4-5 2.4s-3.6-.8-5-2.4z"
        fill="none" stroke="#241a0c" stroke-width="1.3"/>
  <path d="M25.4 17.4l-2.6 3.4" stroke="#241a0c" stroke-width="1.4" stroke-linecap="round"/>

  <!-- bande di piume, solo texture: non incisioni -->
  <path d="M22 22.5c1.6.6 3 .6 4.6 0M37.4 22.5c1.6.6 3 .6 4.6 0"
        stroke="#c98a34" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M23 26.4c2 .8 4 .8 6 0M35 26.4c2 .8 4 .8 6 0"
        stroke="#c98a34" stroke-width="1.3" stroke-linecap="round" fill="none"/>
</svg>
